[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "extrudely"
version = "0.1.0"
description = "2D engineering drawing to parametric 3D CAD reconstruction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/extrudely"]

[dependency-groups]
ai = [
    "accelerate>=1.0",
    "peft>=0.14",
    "torch>=2.0",
    "transformers>=4.50",
]
cad = [
    "cadquery>=2.5",
]
geometry = [
    "ezdxf>=1.4",
    "networkx>=3.0",
    "opencv-python>=4.10",
    "pillow>=11.0",
    "scipy>=1.15",
    "shapely>=2.0",
]
app = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["_bmad/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "benchmark: marks tests as benchmark reproducibility tests",
]
